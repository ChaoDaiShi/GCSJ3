# First-release contract v1. Scientific settings, not machine-specific paths.
# No executable reads this file yet.
schema_version = 1
project_slug = "rs-urban-expansion"
study_area = "成都市新都区"
years = [1992, 2021]
boundary_reference_year = 2021
expected_township_count = 9
target_crs = "EPSG:32648"
analysis_resolution_m = 30
display_resolution_m = 15
float_nodata = -9999.0
class_nodata = 0
mask_nodata = 255
random_seed = 42

[imagery]
requested_date_1992 = "1992-08-16"
requested_date_2021 = "2021-02-05"
date_policy = "keep_requested_unless_teacher_approves_change"
surface_reflectance_scale = 0.0000275
surface_reflectance_offset = -0.2
band_order = ["blue", "green", "red", "nir", "swir1", "swir2"]
landsat5_bands = [1, 2, 3, 4, 5, 7]
landsat8_bands = [2, 3, 4, 5, 6, 7]
pan_rgb_bands = [4, 3, 2]
pan_band = 8
reflectance_resampling = "bilinear"
categorical_resampling = "nearest"

[features]
# 分类实际使用的特征列（顺序必须与 [feature_stack].order 及特征栅格波段顺序一致）
order = [
    "blue", "green", "red", "nir", "swir1", "swir2", "ndvi", "savi", "mndwi", "ndbi", "ui", "bsi", "ibi",
    "nir_mean", "nir_std", "red_mean", "red_std", "swir1_mean", "swir1_std",
]

[feature_stack]
# 01_preprocess --step features 生成的特征堆栈顺序（A 模块交付物）
# 说明：地形三项（elevation/slope/twi）在 2021 年成为空间位置代理、导致城镇类 F1 崩溃，
# 默认不参与分类；如需复现实验，把它们追加到本列表末尾即可（DEM 已在 dem_path 配置）。
order = [
    "blue", "green", "red", "nir", "swir1", "swir2", "ndvi", "savi", "mndwi", "ndbi", "ui", "bsi", "ibi",
    "nir_mean", "nir_std", "red_mean", "red_std", "swir1_mean", "swir1_std",
]
texture_window = 5
# DEM 平滑窗口：ASTER GDEM 在 30m 尺度噪声会主导坡度，5 表示 5×5 均值滤波；设为 1 即用原始 DEM
dem_smooth_window = 5
# TWI 汇流窗口外扩的像元数（67 像元 ≈ 2 km），减少边界汇水缺失
twi_buffer_cells = 67
dem_path = "raw/dem/xindu_dem_mosaic_30m.tif"

[sampling]
split_group = "group_id"
holdout_fraction = 0.25
minimum_labeled_groups_per_class = 8
minimum_holdout_groups_per_class = 2

# 像元纯度过滤：在人工多边形内部再按光谱一致性剔除混合像元。
# 背景：人工面偏大时会混入其他地物（城镇面含绿地），导致类间混淆、建成区高估。
# 规则只用于删除面内明显不符的像元，不改变人工边界，也不参与分类。
[sampling.purity]
enabled = true
[sampling.purity.ranges]
"1" = { ndvi = [0.0, 0.40], ndbi = [-0.10, 1.0] }
"2" = { ndvi = [0.50, 0.78], ndbi = [-1.0, -0.12] }
"3" = { ndvi = [0.66, 1.0], ndbi = [-1.0, -0.20] }
"4" = { ndvi = [-1.0, 0.40], mndwi = [0.0, 1.0] }

# 1992 年 TM 影像（8 月 16 日）整体 NDVI 比 2021 低约 0.05，阈值单列，避免硬套
[sampling.purity.ranges_1992]
"1" = { ndvi = [0.0, 0.45], ndbi = [-0.15, 1.0] }
"2" = { ndvi = [0.45, 0.72], ndbi = [-1.0, -0.15] }
"3" = { ndvi = [0.60, 1.0], ndbi = [-1.0, -0.22] }
"4" = { ndvi = [-1.0, 0.45], mndwi = [0.0, 1.0] }

[model]
algorithm = "random_forest"
n_estimators = 300
min_samples_leaf = 2
max_features = "sqrt"
class_weight = "balanced_subsample"
n_jobs = -1

[postprocess]
sieve_threshold_pixels = 4
connectivity = 8

[evaluation]
overall_accuracy_strictly_greater_than = 0.75
built_up_f1_target = 0.75
class_order = [1, 2, 3, 4]

[analysis]
elapsed_years = 29
comparison_mask = "intersection_of_valid_pixels"
area_unit = "km2"

[[classes]]
code = 1
name = "城镇及建设用地"
color = "#D95F02"

[[classes]]
code = 2
name = "耕地"
color = "#E6C84F"

[[classes]]
code = 3
name = "林草植被"
color = "#2E8B57"

[[classes]]
code = 4
name = "水体"
color = "#377EB8"

[[change_classes]]
code = 1
name = "持续建设"
color = "#D95F02"

[[change_classes]]
code = 2
name = "新增建设"
color = "#E41A1C"

[[change_classes]]
code = 3
name = "减少建设"
color = "#377EB8"

[[change_classes]]
code = 4
name = "持续非建设"
color = "#B3B3B3"

[qgis]
target_version = "3.44 LTR"
project_filename = "xindu_1992_2021.qgz"
dpi = 300
page_format = "A4"
page_orientation = "landscape"
layouts = ["lulc_1992", "lulc_2021", "urban_change", "township_change"]

